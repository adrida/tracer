[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracer-llm"
dynamic = ["version"]
description = "TRACER: classification from teacher traces with selective deferral."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
keywords = [
    "llm", "routing", "surrogate", "cost-reduction", "learn-to-defer",
    "selective-classification", "machine-learning", "explainability", "xai",
    "system-1", "teacher-student",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.4,<3",
    "scikit-learn>=1.4.2",
    "joblib>=1.3.2",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2,<5",
    "torch>=2.4.1",
]
faiss = ["faiss-cpu>=1.7"]
notebooks = [
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2,<5",
    "torch>=2.4.1",
    "pandas>=1.4",
    "matplotlib>=3.5",
    "datasets>=2.0",
    "huggingface_hub>=0.14",
]
viz = ["plotly>=5.0", "kaleido>=0.2"]
xgboost = ["xgboost>=1.7"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
all = [
    "sentence-transformers>=2.2,<5",
    "torch>=2.4.1",
    "faiss-cpu>=1.7",
    "xgboost>=1.7",
    "plotly>=5.0",
    "kaleido>=0.2",
    "pandas>=1.4",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/adrida/tracer"
Repository = "https://github.com/adrida/tracer"
Documentation = "https://github.com/adrida/tracer#readme"
"Bug Tracker" = "https://github.com/adrida/tracer/issues"

[tool.hatch.version]
path = "src/tracer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tracer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
